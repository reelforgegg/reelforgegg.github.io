<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body {
    background:#0d0e12;
    min-height:100vh;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    font-family:-apple-system, "Helvetica Neue", Arial, sans-serif;
    padding:48px 20px;
  }
  .wrap { width:100%; max-width:460px; display:flex; flex-direction:column; align-items:center; }
  .logo {
    width:88px; height:88px; border-radius:22px;
    border:1px solid rgba(184,230,46,.55);
    box-shadow:0 0 28px rgba(184,230,46,.28), 0 0 4px rgba(184,230,46,.4);
    object-fit:cover;
  }
  h1 {
    margin-top:18px;
    font-family:Georgia, "Times New Roman", serif;
    font-weight:600; font-size:30px; letter-spacing:.2px;
    color:#f5f5f5;
  }
  .sub { margin-top:6px; font-size:14px; color:#9aa0a8; }
  .links { margin-top:28px; width:100%; display:flex; flex-direction:column; gap:12px; }
  .card {
    display:flex; align-items:center; gap:14px;
    background:#16181d; border:1px solid #26292f; border-radius:16px;
    padding:14px 18px; text-decoration:none;
    transition:border-color .15s ease, transform .15s ease;
  }
  .card:hover { border-color:rgba(184,230,46,.6); transform:translateY(-1px); }
  .icon {
    width:38px; height:38px; border-radius:10px; background:#22252c;
    display:flex; align-items:center; justify-content:center; flex-shrink:0;
  }
  .meta { display:flex; flex-direction:column; gap:2px; flex:1; min-width:0; }
  .name { color:#f5f5f5; font-size:15px; font-weight:600; }
  .handle { color:#9aa0a8; font-size:13px; }
  .chev { flex-shrink:0; }
  .foot { margin-top:26px; font-size:12px; color:#6b7280; }
</style>
